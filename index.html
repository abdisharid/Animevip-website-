<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeVIP - التطبيق الأقوى لعشاق الأنمي</title>
    
    <!-- كود إثبات الملكية الجديد لـ Google Search Console -->
    <meta name="google-site-verification" content="4byIQEMsp8VNwtRzwSu4MbVDhGODxrzjyTxACcgyLuM" />

    <!-- استيراد خط كايرو الجميل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- استيراد أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #09090b;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .logo-icon {
            font-size: 60px;
            color: #8b5cf6;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            color: #a1a1aa;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            gap: 10px;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            flex: 1;
            font-size: 14px;
            color: #d4d4d8;
        }
        .feature-item i {
            color: #8b5cf6;
            margin-bottom: 5px;
            display: block;
            font-size: 20px;
        }
        .download-btn {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            padding: 16px 35px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
        }
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #71717a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-icon">
            <i class="fa-solid fa-play-circle"></i>
        </div>
        <h1>تطبيق AnimeVIP</h1>
        <p>التطبيق الأمثل لمشاهدة وتحميل أحدث مسلسلات وأفلام الأنمي بأعلى جودة، بدون إعلانات مزعجة وبسيرفرات فائقة السرعة.</p>
        
        <div class="features">
            <div class="feature-item">
                <i class="fa-solid fa-video"></i>
                جودة عالية
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-ban"></i>
                بدون إعلانات
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-bolt"></i>
                سرعة فائقة
            </div>
        </div>

        <!-- رابط التحميل المباشر من جوجل درايف -->
        <a href="https://drive.google.com/file/d/1TSZv8tSu1x8qH1uAHBt6-gzwE9IuuFPf/view?usp=drivesdk" class="download-btn">
            <i class="fa-solid fa-download"></i>
            تحميل ملف APK الآن
        </a>

        <div class="footer">
            نسخة الأندرويد الرسمية
        </div>
    </div>

</body>
</html>
